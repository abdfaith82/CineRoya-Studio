name: Android Cloud APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json from Secret (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Configure Optional App Check & Firebase Overrides from Secrets
        env:
          CI_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
          CI_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          CI_FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
        run: |
          if [ -n "$CI_APPCHECK_DEBUG_TOKEN" ] || [ -n "$CI_RECAPTCHA_SITE_KEY" ] || [ -n "$CI_FIRESTORE_DATABASE_ID" ]; then
            {
              printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              if [ -n "$CI_APPCHECK_DEBUG_TOKEN" ]; then
                printf '    <string name="ci_appcheck_debug_token" translatable="false">%s</string>\n' "$CI_APPCHECK_DEBUG_TOKEN"
              fi
              if [ -n "$CI_RECAPTCHA_SITE_KEY" ]; then
                printf '    <string name="ci_recaptcha_site_key" translatable="false">%s</string>\n' "$CI_RECAPTCHA_SITE_KEY"
              fi
              if [ -n "$CI_FIRESTORE_DATABASE_ID" ]; then
                printf '    <string name="ci_firestore_database_id" translatable="false">%s</string>\n' "$CI_FIRESTORE_DATABASE_ID"
              fi
              printf '</resources>\n'
            } > app/src/main/res/values/ci_appcheck_config.xml
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
